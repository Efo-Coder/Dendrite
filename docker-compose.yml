services:
  # PostgreSQL Datenbank
  database:
    image: postgres:16
    container_name: dendrite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dendrite
      POSTGRES_PASSWORD: dendrite_secure_password
      POSTGRES_DB: dendrite_notes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - dendrite-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dendrite -d dendrite_notes"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dendrite-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://dendrite:dendrite_secure_password@database:5432/dendrite_notes
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      # Puppeteer (in this container) loads the SPA's /print route from here to render PDFs.
      # Service name in dendrite-network — localhost would point at the backend itself.
      FRONTEND_URL: http://frontend:5173
      # Claude API key for AI summarize — put it in a root .env file (gitignored);
      # docker compose reads that automatically. Empty = AI routes return 503.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      database:
        condition: service_healthy
    networks:
      - dendrite-network

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dendrite-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - dendrite-network
    command: npm run dev

volumes:
  postgres_data:

networks:
  dendrite-network:
    driver: bridge
